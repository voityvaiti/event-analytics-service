name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting + Error Prone + NullAway. No tests, so this
  # finishes long before the coverage job and surfaces style/bug-pattern
  # failures quickly. Error Prone runs during compile (NullAway too, on main).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless + Error Prone + NullAway
        run: ./gradlew spotlessCheck compileJava compileTestJava --no-daemon

  # Tests + JaCoCo, with the coverage summary posted as a PR comment.
  # Docker is available on ubuntu-latest, so Testcontainers tests run here.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test + coverage report
        run: ./gradlew test jacocoTestReport --no-daemon

      # jacoco-report posts a fresh comment each run but never deletes the
      # previous one, so old coverage comments pile up on the PR. Delete the
      # prior ones first, leaving only the comment posted by the next step.
      # Scoped to github-actions[bot] comments carrying the report title, so a
      # human comment that happens to mention it is never touched.
      - name: Remove previous coverage comments
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            for (const comment of comments) {
              const byActionBot = comment.user && comment.user.login === 'github-actions[bot]';
              if (byActionBot && comment.body.includes('Coverage report')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }

      # Report-only: posts a fresh coverage comment on the PR. No threshold
      # gate yet (min-coverage stays 0), matching the Stage 0 decision.
      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          min-coverage-overall: 0
          min-coverage-changed-files: 0
