services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_analytics
      POSTGRES_USER: event_analytics
      POSTGRES_PASSWORD: event_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_analytics -d event_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Start observability only through its Compose profile
  # (scripts/actions/observability), keeping extra containers out of default dependency
  # startup.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    # Expose metrics on loopback only. Scraping the app uses the host gateway, not this
    # port.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Map the host gateway so containers can scrape the host app on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    # Anonymous admin access is for this loopback-only development dashboard.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
