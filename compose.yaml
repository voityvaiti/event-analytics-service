services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_analytics
      POSTGRES_USER: event_analytics
      POSTGRES_PASSWORD: event_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_analytics -d event_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Not started by `docker compose up`, and not by bootRun either: an
  # `observability` profile keeps them out of the default set, so the one path
  # every measurement starts through — scripts/actions/dependencies — brings up
  # Postgres and nothing else, exactly as before. scripts/actions/observability
  # names the profile when the stack is actually wanted.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    # Loopback only. Nothing outside this machine has a reason to read the
    # metrics of a development instance, and the scrape itself never uses the
    # published port — it leaves the container the other way, to the host.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The application runs on the host, so the scrape has to leave the compose
    # network to reach it. On Linux that gateway has no name until this maps one.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    # Anonymous and admin, which is defensible only because of the line above:
    # a login wall on a loopback-bound development dashboard buys nothing and
    # costs a password prompt on every restart.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
