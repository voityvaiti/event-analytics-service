# Pin the datasource UID so versioned dashboards resolve it on every machine.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Grafana derives $__rate_interval from this value, not from Prometheus. Match the
    # 2s scrape interval; the 15s default would smooth a 30s test over a minute.
    jsonData:
      timeInterval: 2s
