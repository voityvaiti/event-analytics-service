# The uid is pinned rather than generated. A dashboard checked into this
# repository has to name its datasource, and a uid Grafana invents at first
# start would differ per machine — every panel would load as "datasource not
# found" on the second developer's laptop.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # The only place Grafana can learn how often the target is scraped:
    # $__rate_interval is derived from this value, never from Prometheus itself.
    # Left unset it assumes 15s and averages every rate() on the dashboard over a
    # minute, which smears a 30s cell into a ramp that never reaches its plateau
    # — the opposite of what the 2s scrape in observability/prometheus.yml buys.
    jsonData:
      timeInterval: 2s
