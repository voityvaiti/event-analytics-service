# Scrape the host app through the gateway mapped in compose.yaml.

global:
  # Use 2s scrapes for 30s load runs; the 15s default would provide only two points. See
  # perf/observability-overhead.md for measured cost.
  scrape_interval: 2s
  scrape_timeout: 1s

scrape_configs:
  - job_name: event-analytics
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
