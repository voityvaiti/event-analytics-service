spring:
  application:
    name: event-analytics
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Preserve decimal precision before validation and storage.
      use-big-decimal-for-floats: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Development verification key only; deployments MUST override this location
          # or trust tokens anyone with the repository can sign. See dev-keys/README.md.
          public-key-location: classpath:keys/dev-public-key.pem
          jws-algorithm: RS256
  docker:
    compose:
      lifecycle-management: start-only
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fit send() blocking and delivery inside app.ingestion.publication-timeout.
        max.block.ms: 3000
        delivery.timeout.ms: 3000
        request.timeout.ms: 2500
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # A new group must start from the oldest record, not skip what was already accepted.
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      type: batch
      ack-mode: manual
      # A paused consumer resumes only on its next poll, so this bounds the retry interval.
      poll-timeout: 500ms
  datasource:
    hikari:
      # Set statement_timeout once per physical connection. The 10s bound exceeds
      # measured reads (5.9s over 180 days, 3.6s over 30 days) while limiting stuck
      # queries and lock waits on both paths.
      connection-init-sql: SET statement_timeout = '10s'

app:
  ingestion:
    publication-timeout: 3s
  persistence-consumer:
    control:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  prometheus:
    metrics:
      export:
        # Enable explicitly: on Boot 4.0.6 the export condition defaults to false and
        # the endpoint otherwise returns 404.
        enabled: true
  metrics:
    distribution:
      # Publish histogram buckets so Prometheus can compute p95/p99; count, sum, and max
      # alone are insufficient.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    # ApiExceptionHandler logs these failures with request context; suppress duplicate
    # framework entries.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: error
  pattern:
    # Use Boot's correlation slot. The converter leaves non-request lines blank.
    # Preserve the quoted trailing space; otherwise formatting would remove the
    # separator.
    correlation: "%correlationId{requestId(36)} "

---
spring:
  config:
    activate:
      on-profile: json-logging

logging:
  structured:
    format:
      # Enable JSON stdout for deployment collectors. Logging context, including request
      # ID, becomes top-level ECS fields.
      console: ecs
