spring:
  application:
    name: event-analytics
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  security:
    oauth2:
      resourceserver:
        jwt:
          # The public half only, so the service can verify a token but never mint
          # one — that separation is the whole point of signing asymmetrically.
          # The committed key is a throwaway dev pair (see dev-keys/README.md), so
          # a deployment MUST override this location or it would trust tokens
          # anyone with the repository can sign.
          public-key-location: classpath:keys/dev-public-key.pem
          jws-algorithm: RS256
  docker:
    compose:
      lifecycle-management: start-only
  datasource:
    hikari:
      # Runs once per physical connection, so no request pays for its own bound.
      # Postgres defaults to 0 — no bound at all — which is what this replaces.
      # 10s clears the widest read the corpus can even produce: active-users
      # over its whole 180-day span costs 5.9s, and 30 days costs 3.6s under
      # the load profile's concurrency. So it fires on work no window explains
      # — a stuck statement, a lock, a plan gone wrong — on either path.
      connection-init-sql: SET statement_timeout = '10s'

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  prometheus:
    metrics:
      export:
        # Stated rather than left to the default: on Boot 4.0.6 the exporter's
        # @ConditionalOnEnabledMetricsExport reads the default as false and the
        # endpoint 404s, which the configuration metadata does not predict.
        enabled: true
  metrics:
    distribution:
      # A Prometheus quantile is computed from bucket counts, and Micrometer
      # publishes none by default — without this the scrape carries a count, a
      # sum and a max, from which no p95 or p99 can be recovered afterwards.
      percentiles-histogram:
        http.server.requests: true
